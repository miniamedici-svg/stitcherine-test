<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accademia delle Stitcherine - Area Riservata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 95%;
            max-width: 950px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: max-width 0.2s ease;
        }
        
        /* BARRA SUPERIORE UNICA COMPATTA: Titolo, Benvenuto e Zoom tutti sulla stessa riga */
        .barra-superiore {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            display: none; /* Appare con l'email */
        }

        .titolo-accademia {
            color: #ffb703;
            font-size: 16px;
            font-weight: bold;
            margin: 0;
            text-align: left;
        }

        #benvenuto {
            font-size: 14px;
            color: #e0e0e0;
            margin: 0;
        }

        /* Pulsanti di zoom e indicatore */
        .controlli-zoom {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-zoom {
            background-color: #ffb703;
            color: #121212;
            border: none;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .btn-zoom:hover {
            background-color: #ffa200;
        }
        #testoPercentuale {
            font-size: 12px;
            color: #ffb703;
            margin-left: 5px;
            font-weight: bold;
            min-width: 40px;
            display: inline-block;
        }

        /* Contenitore video fluido */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            margin: 0 auto;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Protezione contro clic esterni o pop-up in alto a destra */
        .protezione-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 70px;
            height: 60px;
            z-index: 99;
            background: transparent;
        }

        /* FILIGRANA DORATA IN MOVIMENTO */
        .watermark {
            position: absolute;
            white-space: nowrap;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
            user-select: none;
            color: rgba(255, 183, 3, 0.65);
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
            animation: movimentoScritta 14s linear infinite;
        }

        @keyframes movimentoScritta {
            0% { left: -20%; top: 15%; }
            50% { left: 70%; top: 75%; }
            100% { left: -20%; top: 15%; }
        }

        @media (min-width: 1200px) {
            .watermark { font-size: 28px; }
        }
        @media (min-width: 768px) and (max-width: 1199px) {
            .watermark { font-size: 22px; }
        }
        @media (max-width: 767px) {
            .watermark { font-size: 16px; }
            body { padding: 10px; }
            .container { padding: 12px; width: 98%; }
            .barra-superiore { flex-direction: column; text-align: center; }
            .titolo-accademia { text-align: center; }
        }

        #errore {
            color: #ff6b6b;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container" id="boxPrincipale">
        
        <!-- BARRA UNICA: Titolo, Benvenuto e Zoom tutti sulla stessa riga -->
        <div class="barra-superiore" id="barraUnica">
            <h3 class="titolo-accademia">✨ Accademia delle Stitcherine</h3>
            <div id="benvenuto">Verifica credenziali...</div>
            <div class="controlli-zoom">
                <span style="font-size: 12px; color: #ccc; margin-right: 2px;">Zoom:</span>
                <button class="btn-zoom" onclick="modificaZoom(-75)">➖</button>
                <button class="btn-zoom" onclick="modificaZoom(75)">➕</button>
                <span id="testoPercentuale">950px</span>
            </div>
        </div>

        <!-- Il Box del Video fluido -->
        <div class="video-container" id="videoBox">
            <div class="protezione-overlay" onclick="alert('Apertura esterna non autorizzata per questa lezione protetta.');"></div>
            <div id="testoWatermark" class="watermark"></div>
            <iframe id="mioVideo" src="" allow="autoplay"></iframe>
        </div>

        <!-- Messaggio di errore -->
        <div id="errore"></div>
    </div>

    <script>
        // Legge l'email dalla barra degli indirizzi
        const urlParams = new URLSearchParams(window.location.search);
        const emailStudente = urlParams.get('email');

        // Larghezza di partenza in pixel del box
        let larghezzaCorrente = 950;

        if (emailStudente) {
            document.getElementById('benvenuto').innerText = "Benvenuta, " + emailStudente;
            document.getElementById('testoWatermark').innerText = emailStudente;
            document.getElementById('mioVideo').src = "https://drive.google.com/file/d/1FADZousRYj1m__TM8R6igyGmAVQPo3Hf/preview";
            document.getElementById('videoBox').style.display = 'block';
            document.getElementById('barraUnica').style.display = 'flex';
        } else {
            document.getElementById('errore').innerText = "Accesso non autorizzato. Per favore, accedi utilizzando il link personale ricevuto su Google Classroom.";
        }

        // Funzione per ingrandire o rimpicciolire con ampio intervallo (da 700px fino a 1850px)
        function modificaZoom(passo) {
            larghezzaCorrente += passo;

            // Limiti ampliati per soddisfare ogni tipo di schermo
            if (larghezzaCorrente < 700) larghezzaCorrente = 700;
            if (larghezzaCorrente > 1850) larghezzaCorrente = 1850;

            const contenitore = document.getElementById('boxPrincipale');
            contenitore.style.maxWidth = larghezzaCorrente + 'px';
            
            // Aggiorna l'indicatore visivo dei pixel
            document.getElementById('testoPercentuale').innerText = larghezzaCorrente + 'px';
        }
    </script>

</body>
</html>
